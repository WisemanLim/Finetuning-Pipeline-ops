# =============================================================================
# WFP 운영 환경 — TLS 오버라이드 (compose.prod.yaml과 함께 사용)
#
# 사용 조건:
#   - 실제 DNS 도메인 보유 (DOMAIN env 설정)
#   - 도메인의 A 레코드가 서버 IP를 가리킴
#   - 80/443 포트 외부 개방 (Let's Encrypt 검증용)
#   - ACME_EMAIL 설정 (Let's Encrypt 알림용)
#
# 실행:
#   docker compose -f compose.prod.yaml -f compose.prod.tls.yaml up -d --build
# 또는:
#   make docker-prod-tls
# =============================================================================

name: wfp-prod

services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP → HTTPS 강제 리다이렉트
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt 자동 인증서
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL required for TLS}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
    ports:
      - "443:443"

  worker:
    labels:
      - "traefik.enable=true"
      # /ws WebSocket — HTTPS로 전환
      - "traefik.http.routers.worker-ws.rule=Host(`${DOMAIN:?DOMAIN required for TLS}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.worker-ws.entrypoints=websecure"
      - "traefik.http.routers.worker-ws.priority=20"
      - "traefik.http.routers.worker-ws.service=worker"
      - "traefik.http.routers.worker-ws.tls.certresolver=le"
      - "traefik.http.services.worker.loadbalancer.server.port=8000"

  web:
    environment:
      NEXTAUTH_URL: https://${DOMAIN}
    labels:
      - "traefik.enable=true"
      # 도메인 일치 시에만 라우팅 (catch-all 제거)
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
