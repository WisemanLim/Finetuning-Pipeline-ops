# =============================================================================
# WFP 운영 환경 — GPU 오버라이드 (compose.prod.yaml과 함께 사용)
#
# 사용:
#   docker compose -f compose.prod.yaml -f compose.prod.gpu.yaml up -d --build
#
# 또는 Makefile:
#   make docker-prod-gpu
#
# 요구사항:
#   - NVIDIA 드라이버 (nvidia-smi 동작)
#   - NVIDIA Container Toolkit (--gpus 지원)
# =============================================================================

name: wfp-prod

services:
  worker:
    build:
      dockerfile: Dockerfile.gpu
    image: wfp-worker:prod-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
